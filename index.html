<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Найди ошибку в коде</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ВРЕМЕННЫЕ КНОПКИ ДЛЯ ПЕРЕКЛЮЧЕНИЯ МЕЖДУ ЭКРАНАМИ -->
    <div class="debug">
    <button onclick="showScreen('start-screen')">Старт</button>
    <button onclick="showScreen('game-screen')">Игра</button>
    <button onclick="showScreen('result-screen')">Результат</button>
    </div>

    <!-- ЭКРАН 1 (СТАРТ) -->
    <div class="screen" id="start-screen">
    <div class="blob"></div>
    <div class="card">
        <div class="logo">&lt;/&gt;</div>
        <h1>Найди ошибку в коде</h1>
        <p class="subtitle">Тренируй внимательность и находи баги в коде</p>

        <div class="mode-select">
        <button class="mode-btn active">Легко</button>
        <button class="mode-btn">Средне</button>
        <button class="mode-btn">Сложно</button>
        </div>

        <button class="btn-primary" id="start-btn">Начать игру</button>

        <p class="hint">Лучший счёт: <b>0</b> · Сыграно раз: <b>0</b></p>
    </div>
    </div>

    <!-- ЭКРАН 2 (САМА ИГРА) -->
    <div class="screen hidden" id="game-screen">
    <div class="card">
        <div class="game-header">
        <div class="stat"><span>Счёт</span><b id="score">30</b></div>
        <div class="stat"><span>Серия</span><b id="streak">3</b></div>
        <div class="stat"><span>Вопрос</span><b><span id="current">5</span><span class="total">/10</span></b></div>
        </div>

        <div class="progress"><div class="progress-fill" id="progress" style="width: 50%"></div></div>

        <div class="code-block" id="code-block">
        <div class="code-line" data-line="1"><span class="line-num">1</span><code>for i in range(len(arr)):</code></div>
        <div class="code-line" data-line="2"><span class="line-num">2</span><code>    if arr[i] = 0:</code></div>
        <div class="code-line" data-line="3"><span class="line-num">3</span><code>        print(i)</code></div>
        </div>

        <p class="task">Нажми на строку с ошибкой</p>

        <div class="feedback hidden" id="feedback"></div>

        <button class="btn-primary hidden" id="next-btn">Дальше →</button>
    </div>
    </div>

    <!-- ЭКРАН 3 (РЕЗУЛЬТАТ) -->
    <div class="screen hidden" id="result-screen">
    <div class="card">
        <h2>Партия окончена</h2>

        <div class="result-score">
        <span class="result-number" id="final-score">80</span>
        <span class="result-of">из 100</span>
        </div>

        <p class="result-message" id="result-message">Неплохо для начала!</p>

        <div class="stats-grid">
        <div class="stat-card"><span>Правильно</span><b id="stat-correct">8</b></div>
        <div class="stat-card"><span>Ошибок</span><b id="stat-wrong">2</b></div>
        <div class="stat-card"><span>Серия</span><b id="stat-streak">5</b></div>
        </div>

        <div class="btn-row">
        <button class="btn-primary" id="restart-btn">Играть снова</button>
        <button class="btn-secondary">Поделиться</button>
        </div>
    </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
